version: '3.8'

services:
  background-removal-api:
    build: .
    runtime: nvidia  # 指定使用NVIDIA运行时
    ports:
      - "6001:6001"
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=all  # 让容器可以访问所有GPU
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility  # 启用计算和工具能力
    volumes:
      - ./models:/app/models  # 可选：用于缓存模型文件
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s